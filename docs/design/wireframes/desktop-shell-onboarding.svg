<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc" id="WF-DESKTOP-SHELL-ONBOARDING">
  <title id="title">Desktop tenant shell and material onboarding wireframe</title>
  <desc id="desc">A 1440 by 1100 warm glass desktop shell showing scope-aware navigation and a resumable material intake queue.</desc>
  <defs><style>.bg{fill:#f0eae4}.glass{fill:#fffaf6;fill-opacity:.76;stroke:#292927;stroke-opacity:.14}.muted{fill:#fffaf6;fill-opacity:.46;stroke:#292927;stroke-opacity:.1}.ink{fill:#292927;font-family:Geist,Arial,sans-serif}.sub{fill:#696059;font-family:Geist,Arial,sans-serif}.accent{fill:#b5533d}.white{fill:#fff;font-family:Geist,Arial,sans-serif}.line{stroke:#292927;stroke-opacity:.14}.ok{fill:#166534}.warn{fill:#92400e}.small{font-size:12px}.body{font-size:14px}.label{font-size:11px;font-weight:600;letter-spacing:.7px}.h1{font-size:24px;font-weight:650}.h2{font-size:16px;font-weight:650}</style></defs>
  <rect class="bg" width="1440" height="1100"/>
  <g id="SHELL-DESKTOP-DEFAULT">
    <rect class="glass" x="0" y="0" width="1440" height="64"/>
    <circle class="accent" cx="34" cy="32" r="14"/><text class="white h2" x="29" y="38">N</text>
    <text class="ink h2" x="58" y="29">Nova Trade</text><text class="sub small" x="58" y="46">Lead intelligence</text>
    <rect class="muted" x="238" y="10" width="260" height="44" rx="9"/><text class="sub label" x="252" y="28">TENANT / SCOPE</text><text class="ink body" x="252" y="46">Aster Materials · Tenant-wide ▾</text>
    <text class="ink body" x="535" y="38">Strategy</text><text class="ink body" x="620" y="38">Research</text><text class="ink body" x="710" y="38">Engagement</text><text class="ink body" x="816" y="38">Reports</text><text class="sub body" x="890" y="38">Legacy ▾</text>
    <rect class="muted" x="1190" y="14" width="94" height="36" rx="8"/><text class="ink small" x="1208" y="36">3 reviews</text>
    <circle class="muted" cx="1312" cy="32" r="18"/><text class="ink small" x="1307" y="36">◐</text><circle class="muted" cx="1362" cy="32" r="18"/><text class="ink small" x="1357" y="36">MS</text>
  </g>
  <g id="ONB-03-MATERIALS">
    <text class="sub label" x="40" y="104">ONBOARDING / STEP 3 OF 5</text><text class="ink h1" x="40" y="137">Add business materials</text><text class="sub body" x="40" y="161">Authorized sources become immutable, evidence-ready records. Progress is saved automatically.</text>
    <rect class="muted" x="1050" y="91" width="350" height="68" rx="12"/><text class="sub label" x="1068" y="113">PROGRESS</text><text class="ink h2" x="1068" y="139">Scope ✓  Policy ✓  Materials  3/5</text>
    <rect class="glass" x="40" y="190" width="480" height="760" rx="16"/><text class="ink h2" x="64" y="226">Choose an authorized input</text>
    <rect class="muted" x="64" y="248" width="432" height="170" rx="12" stroke-dasharray="6 5"/><text class="ink h2" x="178" y="314">Drop permitted files here</text><text class="sub body" x="145" y="340">PDF, spreadsheet, document · limits shown before upload</text><rect class="accent" x="194" y="362" width="172" height="38" rx="8"/><text class="white body" x="229" y="386">Choose files</text>
    <text class="sub label" x="64" y="458">OR ADD A LINK</text><rect class="muted" x="64" y="475" width="432" height="44" rx="8"/><text class="sub body" x="78" y="502">https://authorized-source.example</text><rect class="glass" x="392" y="479" width="100" height="36" rx="7"/><text class="ink body" x="424" y="502">Add</text>
    <text class="sub label" x="64" y="558">OR ADD A NOTE</text><rect class="muted" x="64" y="575" width="432" height="110" rx="8"/><text class="sub body" x="78" y="600">Paste client-provided context…</text>
    <rect class="muted" x="64" y="712" width="432" height="118" rx="10"/><text class="ink h2" x="80" y="739">Tenant-wide responsibility checkpoint</text><text class="sub body" x="80" y="766">Materials and evidence are tenant-wide by D-001.</text><text class="sub body" x="80" y="790">Only add sources this tenant is authorized to use.</text><text class="ink body" x="80" y="816">Policy v3.4 acknowledged · Review →</text>
    <rect class="glass" x="544" y="190" width="856" height="760" rx="16"/><text class="ink h2" x="568" y="226">Intake queue</text><text class="sub body" x="568" y="250">5 items · 2 ready · 2 processing · 1 needs attention</text>
    <line class="line" x1="568" y1="276" x2="1376" y2="276"/>
    <text class="sub label" x="568" y="300">SOURCE</text><text class="sub label" x="990" y="300">STATE</text><text class="sub label" x="1160" y="300">DETAIL</text>
    <g id="STATE-READY"><rect class="muted" x="568" y="320" width="808" height="80" rx="10"/><text class="ink body" x="586" y="350">Product catalog 2026.pdf</text><text class="sub small" x="586" y="373">PDF · 8.2 MB · client-provided</text><text class="ok body" x="990" y="355">✓ Ready</text><text class="sub small" x="1160" y="355">42 pages · 188 facts</text></g>
    <g id="STATE-RUNNING"><rect class="muted" x="568" y="412" width="808" height="80" rx="10"/><text class="ink body" x="586" y="442">Customer export.xlsx</text><text class="sub small" x="586" y="465">Spreadsheet · 2 sheets</text><text class="ink body" x="990" y="447">◌ Extracting</text><text class="sub small" x="1160" y="447">61% · safe to leave</text></g>
    <g id="STATE-DUPLICATE"><rect class="muted" x="568" y="504" width="808" height="80" rx="10"/><text class="ink body" x="586" y="534">Capabilities overview.pdf</text><text class="sub small" x="586" y="557">PDF · content hash matched</text><text class="warn body" x="990" y="539">! Duplicate</text><text class="ink small" x="1160" y="539">Review existing source →</text></g>
    <g id="STATE-PENDING"><rect class="muted" x="568" y="596" width="808" height="80" rx="10"/><text class="ink body" x="586" y="626">aster-materials.com</text><text class="sub small" x="586" y="649">Authorized website · 18 pages found</text><text class="ink body" x="990" y="631">◌ Validating</text><text class="sub small" x="1160" y="631">Source policy check</text></g>
    <g id="STATE-UNSUPPORTED"><rect class="muted" x="568" y="688" width="808" height="80" rx="10"/><text class="ink body" x="586" y="718">Plant tour video.mov</text><text class="sub small" x="586" y="741">Video · 146 MB</text><text class="warn body" x="990" y="723">! Unsupported</text><text class="ink small" x="1160" y="723">See supported formats →</text></g>
    <rect class="muted" x="568" y="800" width="808" height="58" rx="10"/><text class="warn body" x="586" y="835">Partial intake: ready items are preserved; resolve 1 item or continue with known gaps.</text>
    <rect class="glass" x="40" y="976" width="1360" height="84" rx="14"/><text class="sub body" x="64" y="1025">Saved 10:42 AM · You can resume this stage after reload.</text><rect class="muted" x="1144" y="998" width="100" height="40" rx="8"/><text class="ink body" x="1178" y="1023">Back</text><rect class="accent" x="1256" y="998" width="120" height="40" rx="8"/><text class="white body" x="1283" y="1023">Continue</text>
  </g>
</svg>
