<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc" id="WF-MOBILE-ACCOUNT-REVIEW">
  <title id="title">Mobile account review decision wireframe</title><desc id="desc">A 390 by 900 evidence-first mobile review screen ordered as decision, proposal, evidence, and history.</desc>
  <defs><style>.bg{fill:#f0eae4}.glass{fill:#fffaf6;fill-opacity:.8;stroke:#292927;stroke-opacity:.14}.muted{fill:#fffaf6;fill-opacity:.48;stroke:#292927;stroke-opacity:.1}.ink{fill:#292927;font-family:Geist,Arial,sans-serif}.sub{fill:#696059;font-family:Geist,Arial,sans-serif}.accent{fill:#b5533d}.white{fill:#fff;font-family:Geist,Arial,sans-serif}.warn{fill:#92400e}.small{font-size:11px}.body{font-size:13px}.label{font-size:10px;font-weight:600;letter-spacing:.6px}.h1{font-size:20px;font-weight:650}.h2{font-size:15px;font-weight:650}</style></defs><rect class="bg" width="390" height="900"/>
  <g id="SHELL-MOBILE-ACCOUNT-REVIEW"><rect class="glass" width="390" height="56"/><circle class="accent" cx="24" cy="28" r="13"/><text class="white h2" x="19" y="33">N</text><text class="ink h2" x="44" y="33">Nova Trade</text><g id="TARGET-SCOPE-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Change scope"><rect class="muted" x="158" y="6" width="96" height="44" rx="8"/><text class="sub label" x="168" y="22">SCOPE</text><text class="ink small" x="168" y="39">Aster · NA ▾</text></g><g id="TARGET-NOTIFICATIONS-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Notifications, 3 alerts"><rect class="muted" x="258" y="6" width="60" height="44" rx="8"/><text class="ink small" x="268" y="33">3 alerts</text></g><g id="TARGET-MENU-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Open menu"><rect class="muted" x="326" y="6" width="48" height="44" rx="8"/><text class="ink h2" x="343" y="34">☰</text></g></g>
  <g id="REVIEW-02-DECISION-MOBILE"><text class="sub label" x="16" y="84">CONTACT ROLE REVIEW · HIGH IMPACT</text><text class="ink h1" x="16" y="112">Review proposed technical evaluator</text><text class="sub body" x="16" y="135">Midwest Process Supply · version 12</text>
    <g id="DECISION-SUMMARY"><rect class="glass" x="16" y="154" width="358" height="104" rx="14"/><text class="sub label" x="32" y="180">DECISION NEEDED</text><text class="ink h2" x="32" y="207">Confirm Jordan Lee’s role?</text><text class="sub body" x="32" y="232">Proposal is inferred; identity is reviewed separately.</text></g>
    <g id="PROPOSAL"><rect class="glass" x="16" y="270" width="358" height="156" rx="14"/><text class="sub label" x="32" y="296">PROPOSED VALUE</text><text class="ink h2" x="32" y="324">Technical evaluator</text><text class="sub body" x="32" y="349">Process Engineering Manager · confidence 78%</text><rect class="muted" x="32" y="366" width="326" height="42" rx="8"/><text class="warn small" x="44" y="391">Inferred · requires human confirmation</text></g>
    <g id="EVIDENCE"><rect class="glass" x="16" y="438" width="358" height="194" rx="14"/><text class="sub label" x="32" y="464">EVIDENCE · 2 ITEMS</text><text class="ink body" x="32" y="493">Leadership page · “Engineering” section</text><text class="sub small" x="32" y="514">Observed · grade B · retrieved Aug 22</text><g id="TARGET-VIEW-CITATION-MOBILE-ACCOUNT-REVIEW" role="link" aria-label="View citation"><rect class="muted" x="32" y="520" width="132" height="44" rx="8"/><text class="ink small" x="44" y="547">View citation →</text></g><rect class="muted" x="32" y="568" width="326" height="44" rx="8"/><text class="ink body" x="44" y="586">Role responsibility inference</text><text class="warn small" x="44" y="604">Scope language is indirect</text></g>
    <g id="HISTORY"><g id="TARGET-HISTORY-CONFLICTS-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="History and conflicts" aria-expanded="false"><rect class="glass" x="16" y="644" width="358" height="74" rx="14"/><text class="ink body" x="32" y="674">History &amp; conflicts</text><text class="sub small" x="32" y="697">1 prior proposal · no unresolved identity conflict  ▾</text></g></g>
    <g id="STATE-STALE"><rect class="muted" x="16" y="730" width="358" height="58" rx="12"/><text class="warn body" x="32" y="755">Version check runs on submit</text><text class="sub small" x="32" y="775">Changed evidence blocks this decision.</text></g>
    <rect class="glass" x="0" y="800" width="390" height="100"/><g id="TARGET-REJECT-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Reject"><rect class="muted" x="16" y="820" width="82" height="48" rx="9"/><text class="ink body" x="34" y="849">Reject</text></g><g id="TARGET-REQUEST-RESEARCH-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Request research"><rect class="muted" x="108" y="820" width="112" height="48" rx="9"/><text class="ink body" x="126" y="849">Request research</text></g><g id="TARGET-CONFIRM-MOBILE-ACCOUNT-REVIEW" role="button" aria-label="Confirm"><rect class="accent" x="230" y="820" width="144" height="48" rx="9"/><text class="white body" x="274" y="849">Confirm</text></g></g>
</svg>
