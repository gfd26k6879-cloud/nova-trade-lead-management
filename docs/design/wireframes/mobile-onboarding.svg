<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc" id="WF-MOBILE-ONBOARDING">
  <title id="title">Mobile onboarding wireframe</title><desc id="desc">A 390 by 900 scope-aware mobile material intake screen with resumable and partial states.</desc>
  <defs><style>.bg{fill:#f0eae4}.glass{fill:#fffaf6;fill-opacity:.8;stroke:#292927;stroke-opacity:.14}.muted{fill:#fffaf6;fill-opacity:.48;stroke:#292927;stroke-opacity:.1}.ink{fill:#292927;font-family:Geist,Arial,sans-serif}.sub{fill:#696059;font-family:Geist,Arial,sans-serif}.accent{fill:#b5533d}.white{fill:#fff;font-family:Geist,Arial,sans-serif}.ok{fill:#166534}.warn{fill:#92400e}.small{font-size:11px}.body{font-size:13px}.label{font-size:10px;font-weight:600;letter-spacing:.6px}.h1{font-size:21px;font-weight:650}.h2{font-size:15px;font-weight:650}</style></defs><rect class="bg" width="390" height="900"/>
  <g id="SHELL-MOBILE-ONBOARDING"><rect class="glass" width="390" height="56"/><circle class="accent" cx="24" cy="28" r="13"/><text class="white h2" x="19" y="33">N</text><text class="ink h2" x="44" y="33">Nova Trade</text><g id="TARGET-SCOPE-MOBILE-ONBOARDING" role="button" aria-label="Change scope"><rect class="muted" x="158" y="6" width="96" height="44" rx="8"/><text class="sub label" x="168" y="22">SCOPE</text><text class="ink small" x="168" y="39">Aster · TW ▾</text></g><g id="TARGET-NOTIFICATIONS-MOBILE-ONBOARDING" role="button" aria-label="Notifications, 3 alerts"><rect class="muted" x="258" y="6" width="60" height="44" rx="8"/><text class="ink small" x="268" y="33">3 alerts</text></g><g id="TARGET-MENU-MOBILE-ONBOARDING" role="button" aria-label="Open menu"><rect class="muted" x="326" y="6" width="48" height="44" rx="8"/><text class="ink h2" x="343" y="34">☰</text></g></g>
  <g id="ONB-03-MATERIALS-MOBILE"><text class="sub label" x="16" y="84">ONBOARDING · STEP 3 OF 5</text><text class="ink h1" x="16" y="112">Add business materials</text><text class="sub body" x="16" y="135">Saved automatically · resume after reload</text>
    <rect class="glass" x="16" y="154" width="358" height="148" rx="14"/><text class="ink h2" x="32" y="182">Choose an authorized input</text><g id="TARGET-CHOOSE-PERMITTED-FILES-MOBILE-ONBOARDING" role="button" aria-label="Choose permitted files"><rect class="muted" x="32" y="198" width="326" height="52" rx="9"/><text class="ink body" x="109" y="229">＋ Choose permitted files</text></g><g id="TARGET-ADD-LINK-MOBILE-ONBOARDING" role="button" aria-label="Add link"><rect class="muted" x="32" y="254" width="96" height="44" rx="8"/><text class="ink body" x="53" y="281">Add link</text></g><g id="TARGET-ADD-NOTE-MOBILE-ONBOARDING" role="button" aria-label="Add note"><rect class="muted" x="136" y="254" width="96" height="44" rx="8"/><text class="ink body" x="156" y="281">Add note</text></g><g id="TARGET-POLICY-MOBILE-ONBOARDING" role="link" aria-label="View policy version 3.4"><rect class="muted" x="240" y="254" width="118" height="44" rx="8"/><text class="ink body" x="252" y="281">Policy v3.4 →</text></g>
    <text class="ink h2" x="16" y="334">Intake queue</text><text class="sub small" x="16" y="353">2 ready · 2 processing · 1 needs attention</text>
    <g id="STATE-READY"><rect class="glass" x="16" y="370" width="358" height="90" rx="12"/><text class="ink body" x="32" y="398">Product catalog 2026.pdf</text><text class="sub small" x="32" y="420">PDF · 8.2 MB · 42 pages</text><text class="ok body" x="32" y="444">✓ Ready · 188 facts</text></g>
    <g id="STATE-RUNNING"><rect class="glass" x="16" y="472" width="358" height="90" rx="12"/><text class="ink body" x="32" y="500">Customer export.xlsx</text><text class="sub small" x="32" y="522">Spreadsheet · 2 sheets</text><text class="ink body" x="32" y="546">◌ Extracting · 61% · safe to leave</text></g>
    <g id="STATE-UNSUPPORTED"><rect class="glass" x="16" y="574" width="358" height="116" rx="12"/><text class="ink body" x="32" y="602">Plant tour video.mov</text><text class="sub small" x="32" y="624">Video · 146 MB</text><text class="warn body" x="32" y="642">! Unsupported format</text><g id="TARGET-SUPPORTED-FORMATS-MOBILE-ONBOARDING" role="link" aria-label="See supported formats"><rect class="muted" x="32" y="646" width="174" height="44" rx="8"/><text class="ink small" x="44" y="673">See supported formats →</text></g></g>
    <g id="STATE-PARTIAL"><rect class="muted" x="16" y="704" width="358" height="68" rx="12"/><text class="warn body" x="32" y="732">Partial intake</text><text class="sub small" x="32" y="754">Ready items are preserved; continue with known gaps.</text></g>
    <rect class="glass" x="0" y="788" width="390" height="112"/><text class="sub small" x="16" y="816">Saved 10:42 AM</text><g id="TARGET-BACK-MOBILE-ONBOARDING" role="button" aria-label="Back"><rect class="muted" x="16" y="832" width="112" height="48" rx="9"/><text class="ink body" x="57" y="861">Back</text></g><g id="TARGET-CONTINUE-MOBILE-ONBOARDING" role="button" aria-label="Continue"><rect class="accent" x="140" y="832" width="234" height="48" rx="9"/><text class="white body" x="230" y="861">Continue</text></g></g>
</svg>
