<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc" id="WF-DESKTOP-RESEARCH-WORKBENCH">
  <title id="title">Desktop research planning and buying-center workbench wireframe</title><desc id="desc">Warm glass desktop research interface with a bounded discovery plan preview and evidence-backed buying-center review.</desc>
  <defs><style>.bg{fill:#f0eae4}.glass{fill:#fffaf6;fill-opacity:.76;stroke:#292927;stroke-opacity:.14}.muted{fill:#fffaf6;fill-opacity:.46;stroke:#292927;stroke-opacity:.1}.ink{fill:#292927;font-family:Geist,Arial,sans-serif}.sub{fill:#696059;font-family:Geist,Arial,sans-serif}.accent{fill:#b5533d}.white{fill:#fff;font-family:Geist,Arial,sans-serif}.ok{fill:#166534}.warn{fill:#92400e}.line{stroke:#292927;stroke-opacity:.14}.small{font-size:12px}.body{font-size:14px}.label{font-size:11px;font-weight:600;letter-spacing:.7px}.h1{font-size:24px;font-weight:650}.h2{font-size:16px;font-weight:650}</style></defs><rect class="bg" width="1440" height="1100"/>
